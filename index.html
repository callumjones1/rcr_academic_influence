<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCR Journal - Author Influence Database</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        h1 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            opacity: 0.9;
            font-size: 0.9em;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="text"] {
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            flex: 1;
            min-width: 250px;
        }

        select {
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }

        thead {
            background: #f7fafc;
            position: sticky;
            top: 0;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #2d3748;
            border-bottom: 2px solid #e2e8f0;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background: #edf2f7;
        }

        th.sortable::after {
            content: ' ⇅';
            opacity: 0.3;
        }

        th.sorted-asc::after {
            content: ' ↑';
            opacity: 1;
        }

        th.sorted-desc::after {
            content: ' ↓';
            opacity: 1;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:hover {
            background: #f7fafc;
        }

        .rank {
            font-weight: bold;
            color: #667eea;
        }

        .highlight {
            background: #fef5e7;
        }

        .metric-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #edf2f7;
            border-radius: 4px;
            font-size: 0.9em;
            margin: 2px;
        }

        .h-index-high {
            background: #d4edda;
            color: #155724;
        }

        .h-index-medium {
            background: #fff3cd;
            color: #856404;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .pagination {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }

        .page-btn {
            padding: 8px 12px;
            background: #e2e8f0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .page-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            table {
                font-size: 0.9em;
            }

            .controls {
                flex-direction: column;
            }

            input[type="text"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RCR Academic Influence Database</h1>
        <p class="subtitle">Comprehensive Author Metrics & Analytics</p>

        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="total-authors">-</div>
                <div class="stat-label">Total Authors</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-pubs">-</div>
                <div class="stat-label">Total Publications</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avg-h-index">-</div>
                <div class="stat-label">Average h-index</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-citations">-</div>
                <div class="stat-label">Total Citations</div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="search" placeholder="Search authors...">
            <select id="sort-by">
                <option value="h_index">Sort by h-index</option>
                <option value="total_citations">Sort by Citations</option>
                <option value="total_publications">Sort by Publications</option>
                <option value="journal_papers">Sort by Journal Papers</option>
                <option value="author_name">Sort by Name</option>
            </select>
            <select id="per-page">
                <option value="25">25 per page</option>
                <option value="50" selected>50 per page</option>
                <option value="100">100 per page</option>
                <option value="all">Show All</option>
            </select>
            <button onclick="exportToCSV()">Export CSV</button>
        </div>

        <div id="loading" class="loading">Loading data...</div>

        <div id="table-container" style="display: none;">
            <table id="author-table">
                <thead>
                    <tr>
                        <th class="sortable" data-sort="rank">#</th>
                        <th class="sortable" data-sort="author_name">Author</th>
                        <th class="sortable" data-sort="h_index">h-index</th>
                        <th class="sortable" data-sort="i10_index">i10-index</th>
                        <th class="sortable" data-sort="total_publications">Total Pubs</th>
                        <th class="sortable" data-sort="total_citations">Total Citations</th>
                        <th class="sortable" data-sort="avg_citations_per_paper">Avg Citations</th>
                        <th class="sortable" data-sort="journal_papers">Journal Papers</th>
                        <th class="sortable" data-sort="career_span_years">Career Span</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>

            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <script>
        let authorsData = [];
        let filteredData = [];
        let currentPage = 1;
        let perPage = 50;
        let currentSort = { field: 'h_index', direction: 'desc' };

        // Load data
        async function loadData() {
            try {
                const response = await fetch('author_metrics.json');
                const data = await response.json();
                authorsData = data.authors;
                filteredData = [...authorsData];

                updateStats();
                sortData(currentSort.field, currentSort.direction);
                renderTable();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('table-container').style.display = 'block';
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Error loading data: ' + error.message;
            }
        }

        function updateStats() {
            document.getElementById('total-authors').textContent = authorsData.length.toLocaleString();

            const totalPubs = authorsData.reduce((sum, a) => sum + a.total_publications, 0);
            document.getElementById('total-pubs').textContent = totalPubs.toLocaleString();

            const avgHIndex = authorsData.reduce((sum, a) => sum + a.h_index, 0) / authorsData.length;
            document.getElementById('avg-h-index').textContent = avgHIndex.toFixed(1);

            const totalCitations = authorsData.reduce((sum, a) => sum + a.total_citations, 0);
            document.getElementById('total-citations').textContent = totalCitations.toLocaleString();
        }

        function sortData(field, direction = 'desc') {
            currentSort = { field, direction };

            filteredData.sort((a, b) => {
                let aVal = a[field];
                let bVal = b[field];

                if (field === 'author_name') {
                    return direction === 'asc'
                        ? aVal.localeCompare(bVal)
                        : bVal.localeCompare(aVal);
                }

                return direction === 'asc' ? aVal - bVal : bVal - aVal;
            });

            // Update sort indicators
            document.querySelectorAll('th').forEach(th => {
                th.classList.remove('sorted-asc', 'sorted-desc');
                if (th.dataset.sort === field) {
                    th.classList.add(`sorted-${direction}`);
                }
            });
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const start = (currentPage - 1) * perPage;
            const end = perPage === 'all' ? filteredData.length : start + parseInt(perPage);
            const pageData = filteredData.slice(start, end);

            pageData.forEach((author, index) => {
                const row = tbody.insertRow();
                const globalRank = start + index + 1;

                let hIndexClass = '';
                if (author.h_index >= 50) hIndexClass = 'h-index-high';
                else if (author.h_index >= 20) hIndexClass = 'h-index-medium';

                row.innerHTML = `
                    <td class="rank">${globalRank}</td>
                    <td><strong>${author.author_name}</strong><br><small style="color: #718096;">${author.full_name || ''}</small></td>
                    <td><span class="metric-badge ${hIndexClass}">${author.h_index}</span></td>
                    <td>${author.i10_index}</td>
                    <td>${author.total_publications.toLocaleString()}</td>
                    <td>${author.total_citations.toLocaleString()}</td>
                    <td>${author.avg_citations_per_paper.toFixed(1)}</td>
                    <td>${author.journal_papers}</td>
                    <td>${author.career_span_years} years</td>
                `;
            });

            renderPagination();
        }

        function renderPagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredData.length / perPage);

            if (perPage === 'all' || totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = `
                <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">Previous</button>
            `;

            for (let i = 1; i <= Math.min(totalPages, 10); i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }

            if (totalPages > 10) {
                html += `<span>... ${totalPages}</span>`;
            }

            html += `
                <button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">Next</button>
            `;

            pagination.innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            renderTable();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function searchAuthors(query) {
            if (!query) {
                filteredData = [...authorsData];
            } else {
                const lowerQuery = query.toLowerCase();
                filteredData = authorsData.filter(author =>
                    author.author_name.toLowerCase().includes(lowerQuery) ||
                    (author.full_name && author.full_name.toLowerCase().includes(lowerQuery)) ||
                    (author.affiliation && author.affiliation.toLowerCase().includes(lowerQuery))
                );
            }
            currentPage = 1;
            sortData(currentSort.field, currentSort.direction);
            renderTable();
        }

        function exportToCSV() {
            const csv = [
                ['Rank', 'Author', 'Full Name', 'h-index', 'i10-index', 'Total Pubs', 'Total Citations', 'Avg Citations', 'Journal Papers', 'Career Span'],
                ...filteredData.map((a, i) => [
                    i + 1,
                    a.author_name,
                    a.full_name,
                    a.h_index,
                    a.i10_index,
                    a.total_publications,
                    a.total_citations,
                    a.avg_citations_per_paper,
                    a.journal_papers,
                    a.career_span_years
                ])
            ].map(row => row.join(',')).join('\n');

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tpv_author_metrics.csv';
            a.click();
        }

        // Event listeners
        document.getElementById('search').addEventListener('input', (e) => searchAuthors(e.target.value));

        document.getElementById('sort-by').addEventListener('change', (e) => {
            const field = e.target.value;
            sortData(field, field === 'author_name' ? 'asc' : 'desc');
            renderTable();
        });

        document.getElementById('per-page').addEventListener('change', (e) => {
            perPage = e.target.value === 'all' ? 'all' : parseInt(e.target.value);
            currentPage = 1;
            renderTable();
        });

        document.querySelectorAll('th.sortable').forEach(th => {
            th.addEventListener('click', () => {
                const field = th.dataset.sort;
                const direction = currentSort.field === field && currentSort.direction === 'desc' ? 'asc' : 'desc';
                sortData(field, direction);
                renderTable();
            });
        });

        // Load data on page load
        loadData();
    </script>
</body>
</html>
